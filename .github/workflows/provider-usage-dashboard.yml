name: Provider usage dashboard
on:
  push:
    paths: ['apps/provider-usage-dashboard/**', '.github/workflows/provider-usage-dashboard.yml']
  pull_request:
    paths: ['apps/provider-usage-dashboard/**', '.github/workflows/provider-usage-dashboard.yml']
jobs:
  dashboard:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: dashboard-test-only
          POSTGRES_DB: reporting_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://postgres:dashboard-test-only@127.0.0.1:5432/reporting_test
    defaults:
      run:
        working-directory: apps/provider-usage-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/provider-usage-dashboard/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests
      - run: node --test tests/controls.test.mjs
      - run: bash -n deploy.sh
      - run: docker build -t provider-usage-dashboard-test .
