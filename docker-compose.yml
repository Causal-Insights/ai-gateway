services:
  postgres:
    image: postgres:16-alpine
    container_name: litellm-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm_local
      POSTGRES_DB: litellm_local
    volumes:
      - litellm-local-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm_local"]
      interval: 5s
      timeout: 5s
      retries: 20

  litellm:
    image: ai-gateway-litellm:local
    platform: linux/amd64
    build: .
    container_name: litellm-proxy
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${LOCAL_DATABASE_URL:-postgresql://litellm:litellm_local@postgres:5432/litellm_local}
      PORT: 4000
      CONFIG_FILE_PATH: /app/litellm_config.yaml
      # Local Vertex requests use the host's gcloud Application Default
      # Credentials. Cloud Run continues to use its attached service account.
      GOOGLE_APPLICATION_CREDENTIALS: /var/run/google/application_default_credentials.json
      # Registration emits one warning per custom deployment when cache pricing
      # is inapplicable. Keep production warnings intact; filter only this known
      # local startup message.
      SUPPRESS_LITELLM_REGISTER_MODEL_CACHE_WARNINGS: "true"
      # Local durable jobs poll inside this container. This takes precedence
      # over any production Cloud Tasks settings present in .env.
      GENERATION_LOCAL_POLLING: "true"
      GENERATION_LOCAL_POLL_TARGET_URL: http://127.0.0.1:4000
      # Append-only audit log of ARK task ids (enable in .env). Mount a host file below.
      SEEDANCE_TASK_LEDGER_PATH: ${SEEDANCE_TASK_LEDGER_PATH:-/app/seedance_task_ledger.jsonl}
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/litellm_config.yaml:ro
      - ./custom_handler.py:/app/custom_handler.py:ro
      - ./custom_handler_audio.py:/app/custom_handler_audio.py:ro
      - ./custom_handler_common.py:/app/custom_handler_common.py:ro
      - ./custom_handler_xai.py:/app/custom_handler_xai.py:ro
      - ./custom_handler_seedance.py:/app/custom_handler_seedance.py:ro
      - ./custom_handler_seedream.py:/app/custom_handler_seedream.py:ro
      - ./generation_job_models.py:/app/generation_job_models.py:ro
      - ./generation_job_repository.py:/app/generation_job_repository.py:ro
      - ./generation_job_adapters.py:/app/generation_job_adapters.py:ro
      - ./generation_job_scheduler.py:/app/generation_job_scheduler.py:ro
      - ./generation_job_routes.py:/app/generation_job_routes.py:ro
      - ./gateway_request_policy.py:/app/gateway_request_policy.py:ro
      - ./gateway_logging.py:/app/gateway_logging.py:ro
      - ./gateway_healthcheck.py:/app/gateway_healthcheck.py:ro
      - ./gateway_server.py:/app/gateway_server.py:ro
      - ./gateway_entrypoint.sh:/app/gateway_entrypoint.sh:ro
      - ./callback_server.py:/app/callback_server.py:ro
      - ./migrations:/app/migrations:ro
      - ./seedance_task_ledger.jsonl:/app/seedance_task_ledger.jsonl
      - /Users/jason/dev/keys:/Users/jason/dev/keys:ro
      - ${LOCAL_GOOGLE_ADC_PATH:-/Users/jason/.config/gcloud/application_default_credentials.json}:/var/run/google/application_default_credentials.json:ro
    healthcheck:
      test: ["CMD", "python", "/app/gateway_healthcheck.py"]
      interval: 5s
      timeout: 6s
      retries: 30
      start_period: 30s

volumes:
  litellm-local-db:
