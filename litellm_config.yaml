        - image_urls
        - image_file_id
        - image_file_ids
        - n
        - size
        - resolution
        - aspect_ratio
        - response_format
        - output_format
        - storage_options
        - quality
        - style
        - background
        - user
      input_cost_per_token: 0
      output_cost_per_token: 0
      # xAI Grok Imagine Image Quality input/output fallback rates:
      # $0.01 input image + $0.05 output image. Text/thinking pricing is not published separately.
      # Text-only generation is $0.05/image; 2K output with one input image is $0.08/image.
      input_cost_per_image: 0.01
      output_cost_per_image: 0.05

  - model_name: grok-imagine-image-quality
