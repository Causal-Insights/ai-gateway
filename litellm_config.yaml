model_list:
  # ── Local ────────────────────────────────────────────────────────────────
  - model_name: gemma-4-large
    litellm_params:
      model: openai/mlx-community/gemma-4-31b-it-8bit
      api_base: os.environ/MLX_VLM_API_BASE
      api_key: os.environ/MLX_VLM_API_KEY

  # ── OpenAI ───────────────────────────────────────────────────────────────
  - model_name: gpt-latest
    litellm_params:
      model: openai/gpt-5.5
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-5.5
    litellm_params:
      model: openai/gpt-5.5
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-5.4
    litellm_params:
      model: openai/gpt-5.4
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-5.4-mini
    litellm_params:
      model: openai/gpt-5.4-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-5.4-nano
    litellm_params:
      model: openai/gpt-5.4-nano
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-image-1.5
    litellm_params:
      model: openai/gpt-image-1.5
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-image-2
    litellm_params:
      model: openai/gpt-image-2
      api_key: os.environ/OPENAI_API_KEY

  # ── Gemini text ──────────────────────────────────────────────────────────
  - model_name: gemini-latest
    litellm_params:
      model: vertex_ai/gemini-3.1-pro-preview
      vertex_project: os.environ/GOOGLE_CLOUD_PROJECT
      vertex_location: os.environ/GOOGLE_CLOUD_LOCATION

  - model_name: gemini-3.1-pro
    litellm_params:
      model: vertex_ai/gemini-3.1-pro-preview
      vertex_project: os.environ/GOOGLE_CLOUD_PROJECT
      vertex_location: os.environ/GOOGLE_CLOUD_LOCATION

  - model_name: gemini-3.1-pro-customtools
    litellm_params:
      model: vertex_ai/gemini-3.1-pro-preview-customtools
      vertex_project: os.environ/GOOGLE_CLOUD_PROJECT
      vertex_location: os.environ/GOOGLE_CLOUD_LOCATION

  - model_name: gemini-3-flash-preview
    litellm_params:
      model: vertex_ai/gemini-3-flash-preview
      vertex_project: os.environ/GOOGLE_CLOUD_PROJECT
      vertex_location: os.environ/GOOGLE_CLOUD_LOCATION

  # Optional: keep only if you explicitly want the older preview endpoint
  - model_name: gemini-3.1-flash-lite-preview
    litellm_params:
      model: vertex_ai/gemini-3.1-flash-lite-preview
      vertex_project: os.environ/GOOGLE_CLOUD_PROJECT
      vertex_location: os.environ/GOOGLE_CLOUD_LOCATION

  # ── Nano Banana / Gemini image ───────────────────────────────────────────
  - model_name: nano-banana
    litellm_params:
      model: vertex_ai/gemini-3.1-flash-image-preview
      vertex_project: os.environ/GOOGLE_CLOUD_PROJECT
      vertex_location: os.environ/GOOGLE_CLOUD_LOCATION

  - model_name: nano-banana-2
    litellm_params:
      model: vertex_ai/gemini-3.1-flash-image-preview
      vertex_project: os.environ/GOOGLE_CLOUD_PROJECT
      vertex_location: os.environ/GOOGLE_CLOUD_LOCATION

  - model_name: nano-banana-pro
    litellm_params:
      model: vertex_ai/gemini-3-pro-image-preview
      vertex_project: os.environ/GOOGLE_CLOUD_PROJECT
      vertex_location: os.environ/GOOGLE_CLOUD_LOCATION

  # ── Veo ──────────────────────────────────────────────────────────────────
  - model_name: veo-3.1
    litellm_params:
      model: vertex_ai/veo-3.1-generate-001
      vertex_project: os.environ/GOOGLE_CLOUD_PROJECT
      vertex_location: os.environ/GOOGLE_CLOUD_LOCATION

  - model_name: veo-3.1-fast
    litellm_params:
      model: vertex_ai/veo-3.1-fast-generate-001
      vertex_project: os.environ/GOOGLE_CLOUD_PROJECT
      vertex_location: os.environ/GOOGLE_CLOUD_LOCATION

  - model_name: veo-3.1-lite
    litellm_params:
      model: vertex_ai/veo-3.1-lite-generate-001
      vertex_project: os.environ/GOOGLE_CLOUD_PROJECT
      vertex_location: os.environ/GOOGLE_CLOUD_LOCATION

  # ── Imagen 4 ─────────────────────────────────────────────────────────────
  - model_name: imagen-4.0
    litellm_params:
      model: vertex_ai/imagen-4.0-generate-001
      vertex_project: os.environ/GOOGLE_CLOUD_PROJECT
      vertex_location: os.environ/GOOGLE_CLOUD_LOCATION

  - model_name: imagen-4.0-fast
    litellm_params:
      model: vertex_ai/imagen-4.0-fast-generate-001
      vertex_project: os.environ/GOOGLE_CLOUD_PROJECT
      vertex_location: os.environ/GOOGLE_CLOUD_LOCATION

  - model_name: imagen-4.0-ultra
    litellm_params:
      model: vertex_ai/imagen-4.0-ultra-generate-001
      vertex_project: os.environ/GOOGLE_CLOUD_PROJECT
      vertex_location: os.environ/GOOGLE_CLOUD_LOCATION

  # ── xAI (custom: video) ─────────────────────────────────────────────────
  - model_name: grok-video
    litellm_params:
      model: grok-video/grok-2-video-generation
      api_key: os.environ/GROK_API_KEY

  # ── xAI (custom: image) ─────────────────────────────────────────────────
  - model_name: grok-image
    litellm_params:
      model: grok-image/grok-imagine-image-quality
      api_key: os.environ/GROK_API_KEY

  - model_name: grok-imagine-image-quality
    litellm_params:
      model: grok-image/grok-imagine-image-quality
      api_key: os.environ/GROK_API_KEY

  # ── Seedance 2.0 (BytePlus ARK) ───────────────────────────────────────────
  - model_name: seedance-2.0
    litellm_params:
      model: seedance/dreamina-seedance-2-0-260128
      api_key: os.environ/BYTEDANCE_API_KEY
    model_info:
      mode: image_generation
      input_cost_per_token: 0
      output_cost_per_token: 0
      input_cost_per_second: 0.50

  - model_name: seedance-2.0-fast
    litellm_params:
      model: seedance/dreamina-seedance-2-0-fast-260128
      api_key: os.environ/BYTEDANCE_API_KEY
    model_info:
      mode: image_generation
      input_cost_per_token: 0
      output_cost_per_token: 0
      input_cost_per_second: 0.50

  # ── xAI ──────────────────────────────────────────────────────────────────
  - model_name: grok-latest
    litellm_params:
      model: xai/grok-4.20-non-reasoning-latest
      api_key: os.environ/XAI_API_KEY

  - model_name: grok-4.20-reasoning
    litellm_params:
      model: xai/grok-4.20-reasoning-latest
      api_key: os.environ/XAI_API_KEY

  - model_name: grok-4.20
    litellm_params:
      model: xai/grok-4.20-non-reasoning-latest
      api_key: os.environ/XAI_API_KEY

  # ── ElevenLabs TTS ───────────────────────────────────────────────────────
  - model_name: tts-quality
    litellm_params:
      model: elevenlabs/eleven_multilingual_v2
      api_key: os.environ/ELEVENLABS_API_KEY

  - model_name: tts-fast
    litellm_params:
      model: elevenlabs/eleven_flash_v2_5
      api_key: os.environ/ELEVENLABS_API_KEY

  - model_name: tts-turbo
    litellm_params:
      model: elevenlabs/eleven_turbo_v2_5
      api_key: os.environ/ELEVENLABS_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # disable_health_check: true

litellm_settings:
  drop_params: true
  custom_provider_map:
    - provider: grok-video
      custom_handler: custom_handler.grok_video
    - provider: grok-image
      custom_handler: custom_handler.grok_image
    - provider: seedance
      custom_handler: custom_handler.seedance