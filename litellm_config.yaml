  # ── xAI (custom: video) ─────────────────────────────────────────────────
  # grok-imagine-video: output billed per generated second (480p $0.05/s, 720p $0.07/s).
  # Handler prefers xAI usage.cost_in_usd_ticks from poll responses; rates below are fallback.
  - model_name: grok-video
    litellm_params:
      model: grok-video/grok-imagine-video
      api_key: os.environ/GROK_API_KEY
      timeout: 1260
    model_info:
      mode: image_generation
      supported_openai_params:
        - duration
        - seconds
        - aspect_ratio
        - resolution
        - image
        - image_url
        - image_file_id
        - video
        - video_url
        - video_file_id
        - reference_images
        - reference_image_urls
        - referenceImageUrls
        - reference_image_file_ids
        - reference_audios
        - reference_voice_ids
        - operation
        - output
        - storage_options
        - user
      input_cost_per_token: 0
      output_cost_per_token: 0
      output_cost_per_second: 0.05
      output_cost_per_second_720p: 0.07
      output_cost_per_second_1080p: 0.07
      metadata:
        grok_imagine_video_upstream: grok-imagine-video
        grok_video_price_per_second_480p: 0.05
        grok_video_price_per_second_720p: 0.07
        grok_video_reference_image_usd: 0.002
        grok_video_input_video_per_second_usd: 0.01

  # grok-imagine-video-1.5-preview (alias grok-imagine-video-1.5-2026-05-30): 480p $0.08/s, 720p $0.14/s; input image $0.01.
  - model_name: grok-video-1.5
    litellm_params:
      model: grok-video/grok-imagine-video-1.5
      api_key: os.environ/GROK_API_KEY
      timeout: 1260
    model_info:
      mode: image_generation
      supported_openai_params:
        - duration
        - seconds
        - aspect_ratio
        - resolution
        - image
        - image_url
        - image_file_id
        - video
        - video_url
        - video_file_id
        - reference_images
        - reference_image_urls
        - referenceImageUrls
        - reference_image_file_ids
        - reference_audios
        - reference_voice_ids
        - operation
        - output
        - storage_options
        - user
      input_cost_per_token: 0
      output_cost_per_token: 0
      output_cost_per_second: 0.08
      output_cost_per_second_720p: 0.14
      output_cost_per_second_1080p: 0.25
      metadata:
        grok_imagine_video_upstream: grok-imagine-video-1.5
        grok_video_price_per_second_480p: 0.08
        grok_video_price_per_second_720p: 0.14
        grok_video_price_per_second_1080p: 0.25
        grok_video_reference_image_usd: 0.01
        grok_video_input_video_per_second_usd: 0.01

  - model_name: grok-imagine-video-1.5-2026-05-30
    litellm_params:
      model: grok-video/grok-imagine-video-1.5-2026-05-30
      api_key: os.environ/GROK_API_KEY
      timeout: 1260
    model_info:
      mode: image_generation
      supported_openai_params:
        - duration
        - seconds
        - aspect_ratio
