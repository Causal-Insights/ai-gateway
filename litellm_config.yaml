        - image_file_ids
        - n
        - size
        - resolution
        - aspect_ratio
        - response_format
        - output_format
        - storage_options
        - quality
        - style
        - background
        - user
      input_cost_per_token: 0
      output_cost_per_token: 0
      # xAI Grok Imagine Image Quality input/output fallback rates:
      # $0.01 input image + $0.05 output image. Text/thinking pricing is not published separately.
      # Text-only generation is $0.05/image; 2K output with one input image is $0.08/image.
      input_cost_per_image: 0.01
      output_cost_per_image: 0.05

  # ── Seedance 2.0 (BytePlus ARK) ───────────────────────────────────────────
  # The custom handler submits an ARK task, then waits up to SEEDANCE_SYNC_WAIT_S
  # (default 240s) before falling back to an async-polling response. Clients can
  # poll a returned task ID by re-posting with `seedance_task_id=<id>`.
  # Per-request `wait_seconds` (0..SEEDANCE_POLL_TIMEOUT_S) overrides the default.
  # Cost is computed in-handler from ARK's `usage.completion_tokens` and the
  # rate below; LiteLLM's `_hidden_params["response_cost"]` is used directly.
  - model_name: seedance-2.0
    litellm_params:
      model: seedance/dreamina-seedance-2-0-260128
      api_key: os.environ/BYTEDANCE_API_KEY
      timeout: 1800
    model_info:
      mode: image_generation
      # Pass through on /v1/images/generations (drop_params must not strip these).
      supported_openai_params:
        - seedance_task_id
        - poll_task_id
        - task_id
        - wait_seconds
        - async_submit
        - reference_image_urls
        - referenceImageUrls
        - image_url
        - video_url
        - videos
        - generate_audio
        - watermark
        - resolution
        - ratio
        - duration
      input_cost_per_token: 0
      output_cost_per_token: 0
      # BytePlus ARK rate for Seedance 2.0 (480p/720p, no input video):
      # $7.00 per 1M output tokens. tokens ≈ width × height × fps × seconds / 1024.
      # The handler computes the actual response cost from the upstream usage block.
      metadata:
        seedance_price_per_mtok: 7.00
        seedance_price_per_mtok_with_input_video: 4.30

  - model_name: seedance-2.0-fast
    litellm_params:
      model: seedance/dreamina-seedance-2-0-fast-260128
      api_key: os.environ/BYTEDANCE_API_KEY
      timeout: 1800
    model_info:
      mode: image_generation
      supported_openai_params:
        - seedance_task_id
        - poll_task_id
        - task_id
        - wait_seconds
        - async_submit
        - reference_image_urls
        - referenceImageUrls
        - image_url
        - video_url
        - videos
        - generate_audio
        - watermark
        - resolution
        - ratio
        - duration
      input_cost_per_token: 0
      output_cost_per_token: 0
      # BytePlus ARK rate for Seedance 2.0 Fast (480p/720p, no input video):
      # $5.60 per 1M output tokens. Handler computes per-response cost.
      metadata:
        seedance_price_per_mtok: 5.60
        seedance_price_per_mtok_with_input_video: 3.30

  # ── Seedream 5 (BytePlus ModelArk) ───────────────────────────────────────
  # Sync POST /images/generations — handler sets x-litellm-response-cost from
  # output image count × per-image rate (+ optional web_search surcharge).
  # ModelArk: https://docs.byteplus.com/en/docs/ModelArk/1541523
  - model_name: seedream-5.0
    litellm_params:
      model: seedream/seedream-5-0-260128
      api_key: os.environ/BYTEDANCE_API_KEY
      timeout: 300
    model_info:
      mode: image_generation
      supported_openai_params:
        - image
        - images
        - image_urls
        - reference_image_urls
        - referenceImageUrls
        - size
        - n
        - response_format
        - output_format
        - watermark
        - stream
        - seed
        - sequential_image_generation
        - sequential_image_generation_options
        - tools
        - optimize_prompt_options
      input_cost_per_token: 0
      output_cost_per_token: 0
      input_cost_per_image: 0.035
      metadata:
        seedream_price_per_image: 0.035
        seedream_web_search_price_per_request: 0.0006

  - model_name: seedream-5.0-lite
    litellm_params:
      model: seedream/seedream-5-0-lite-260128
      api_key: os.environ/BYTEDANCE_API_KEY
      timeout: 300
    model_info:
      mode: image_generation
      supported_openai_params:
        - image
        - images
        - image_urls
        - reference_image_urls
        - referenceImageUrls
        - size
        - n
        - response_format
        - output_format
        - watermark
        - stream
        - seed
        - sequential_image_generation
        - sequential_image_generation_options
        - tools
        - optimize_prompt_options
      input_cost_per_token: 0
      output_cost_per_token: 0
      input_cost_per_image: 0.035
      metadata:
        seedream_price_per_image: 0.035
        seedream_web_search_price_per_request: 0.0006

